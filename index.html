<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Avery &amp; Morgan Seating</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap"><style id="app-css">
/* Layout: guest pool (left) · Willow Hall floor plan (center) · table inspector (right)
   Garden Party: sage paper, blush and champagne accents, italic serif display. Light only, in both system themes. */
:root{
  --bg:#f2f5ee;--panel:#fbfcf8;--raised:#ffffff;--ink:#2f3a33;--muted:#66756b;--faint:#9aa79e;
  --line:#dde6d9;--line-strong:#c7d4c3;--wall:#a9bca6;
  --accent:#5d7c60;--accent-ink:#ffffff;--accent-soft:#e3ece0;--gold:#cf9c94;
  --floor:#eef2ea;--room:#ffffff;--dance:#f6f9f3;--tablebg:#ffffff;--empty:#e9efe6;
  --dotS:42%;--dotL:85%;--edgeL:60%;
  --danger:#a8463f;--ok:#4f7d5c;--warn:#a5722f;
  --scrim:rgb(47 58 51/.35);
  --shadow:0 1px 2px rgb(70 95 72/.08),0 10px 30px rgb(70 95 72/.10);
  --font-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --font-script:"Cormorant Garamond","Cormorant",Georgia,serif;
  --font-body:"Jost","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.35}
#app{height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:6px 12px;line-height:1.2}
button:hover:not(:disabled){border-color:var(--line-strong)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:99px;padding-inline:18px}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.ic{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tint{background:hsl(var(--h) var(--dotS) var(--dotL));border-color:hsl(var(--h) 45% var(--edgeL))!important}

/* header */
header.top{position:relative;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px}
.brand .sprig{flex:none;stroke:var(--accent)}.brand .sprig .lf{fill:var(--accent-soft)}.brand .sprig .bl{fill:hsl(8 60% 88%);stroke:var(--gold)}
.brand h1{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:34px;margin:0;line-height:1;color:var(--ink)}
.brand h1 .amp{color:var(--accent);padding:0 .06em}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.meter{display:flex;align-items:center;gap:10px;flex:1;min-width:200px;max-width:420px}
.meter .bar{flex:1;height:8px;border-radius:99px;background:var(--empty);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.meter .num{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.meter .num b{font-size:16px}
.actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted);padding:0 6px;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.ok::before{background:var(--ok)}.status.warn::before{background:var(--warn)}.status.busy::before{background:var(--accent)}
.iconbtn{padding:6px 8px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--raised);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:40;min-width:250px;padding:4px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:5px}
.menu button:hover{background:var(--empty)}
.menu small{display:block;color:var(--muted);font-size:11.5px}

/* grid */
main.grid{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 310px}
main.grid.cards-view{grid-template-columns:320px minmax(0,1fr)}
main.grid.cards-view .inspector{display:none}

/* pool */
.pool{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.buckets{border-bottom:1px solid var(--line)}
.buckets summary{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 8px;cursor:pointer;list-style:none}
.buckets summary::-webkit-details-marker{display:none}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.buckets summary .tot{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.buckets summary .tot b{color:var(--ink);font-size:15px}
#bucketList{max-height:34vh;overflow:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:1px}
.brow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:2px 8px;border:0;background:none;padding:5px 8px;border-radius:6px;text-align:left}
.brow:hover{background:var(--empty)}
.brow.on{background:var(--accent-soft)}
.brow .sw{width:10px;height:10px;border-radius:3px;border:1px solid}
.brow .bn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bc{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.brow .bc b{font-size:14px;color:var(--ink)}
.brow.done .bc b{color:var(--ok)}
.brow.done .bn{color:var(--muted)}
.brow .bar{grid-column:2/4;height:3px;background:var(--empty);border-radius:9px;overflow:hidden}
.brow .bar i{display:block;height:100%;background:hsl(var(--h) 45% var(--edgeL))}
#fq{border-radius:99px;padding-inline:14px}
.filters{padding:10px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.list{flex:1;min-height:120px;overflow:auto;padding:8px 12px 12px;display:flex;flex-direction:column;gap:4px}
.list.over{background:var(--accent-soft)}
.ghead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 2px 2px;display:flex;justify-content:space-between}
.list .none{color:var(--muted);text-align:center;padding:24px 8px;font-size:13px}
.list .none.slim{padding:10px 8px}
.found{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:8px;text-align:left;padding:7px 10px;border-radius:10px}
.found .sw{width:10px;height:10px;border-radius:50%;border:1px solid}
.found .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.found .where{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.plan.searching .seat.filled:not(.hit){opacity:.28}
.seat.hit{box-shadow:0 0 0 3px var(--raised),0 0 0 6px var(--gold);z-index:2}
.poolfoot{padding:10px 12px;border-top:1px solid var(--line)}
.wide{width:100%}

/* chip */
.chip{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;border:1px solid var(--line);background:var(--raised);border-radius:12px;cursor:grab;flex:1;min-width:0;user-select:none}
.chip:hover{border-color:var(--line-strong)}
.chip.picked{outline:2px solid var(--accent);outline-offset:1px}
.chip.ghosted{opacity:.4}
.chip .sw{width:10px;height:10px;border-radius:50%;border:1px solid;flex:none}
.chip .cn{display:flex;flex-direction:column;min-width:0;flex:1}
.chip .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .bk{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .tag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:99px;background:var(--empty);color:var(--muted);flex:none}
.ib{border:0;background:none;padding:3px;border-radius:4px;color:var(--muted);opacity:.7;flex:none}
.ib:hover{opacity:1;background:var(--empty);color:var(--ink)}

/* stage */
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.toolbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--bg)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:5px;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.12)}
.sel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;border:1px solid}
.spacer{flex:1}
.zoom{display:flex;align-items:center;gap:4px;font-size:12px;font-variant-numeric:tabular-nums}
.zoom button{padding:3px 9px}
.zoom span{min-width:40px;text-align:center;color:var(--muted)}
button.on-toggle{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pickbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--accent-soft);font-size:13px;border-bottom:1px solid var(--line)}
.pickbar button{margin-left:auto;padding:3px 10px}
.planwrap{flex:1;overflow:auto;padding:16px;background:var(--floor);min-height:0}
.sizer{position:relative;margin:0 auto}
.plan{position:absolute;left:0;top:0;width:1430px;height:1060px;transform-origin:0 0}
.room{position:absolute;left:40px;top:40px;width:1355px;height:875px;background:var(--room);border:4px solid var(--wall);border-radius:16px;box-shadow:var(--shadow);box-sizing:border-box;border-radius:2px}
.door{position:absolute;background:var(--floor)}
.lbl{position:absolute;font-size:15px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.dance{position:absolute;left:591px;top:142px;width:314px;height:314px;border:1.5px dashed var(--line-strong);border-radius:16px;background:var(--dance);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}
.dance b{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:38px;color:var(--accent)}
.dance span{font-size:14px;letter-spacing:.04em}
.fixture{position:absolute;border:1.5px solid var(--line-strong);background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);border-radius:3px}
.hint-cap{position:absolute;font-size:13px;color:var(--faint);text-align:center}
.scale{position:absolute;left:1240px;top:965px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.scale i{display:block;width:150.6px;height:8px;border:2px solid var(--muted);border-top:0}
.tbl{position:absolute}
.core{position:absolute;background:var(--tablebg);border:2px solid var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box}
.round .core{border-radius:50%;box-shadow:inset 0 0 0 4px var(--tablebg),inset 0 0 0 5px var(--line)}
.head .core{border-radius:8px;box-shadow:inset 0 0 0 4px var(--tablebg),inset 0 0 0 5px var(--line)}
.core .tn{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1}
.head .core .tn{font-size:20px}
.core .tc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.tbl.full .core .tc{color:var(--ok);font-weight:700}
.tbl.sel .core{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.core.over{box-shadow:0 0 0 6px var(--accent)!important}
.plan.layout .core{cursor:move;border-style:dashed;border-color:var(--accent)}
.seat{position:absolute;width:31px;height:31px;margin:-15.5px 0 0 -15.5px;border-radius:50%;border:1.5px dashed var(--line-strong);background:var(--room);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:-.02em;box-sizing:border-box;cursor:pointer}
.seat.filled{border-style:solid;cursor:grab}
.seat.filled.tint{background:hsl(var(--h) var(--dotS) var(--dotL)/.75);color:var(--ink)}
.seat.picked{box-shadow:0 0 0 4px var(--accent)}
.seat.over{box-shadow:0 0 0 4px var(--accent);border-color:var(--accent)}
.seat.ghosted{opacity:.35}
body.dragging .seat:not(.filled){border-color:var(--accent)}

/* inspector + cards */
.inspector{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:auto}
.insp-empty{padding:24px 20px;color:var(--muted);font-size:13px}
.insp-empty h3{font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--ink);margin:0 0 8px}
.insp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:14px 16px 8px}
.tname{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.tname span{font-family:var(--font-display);font-size:22px}
.tname input{font-family:var(--font-display);font-size:22px;width:120px;padding:0 6px;border-color:transparent;background:transparent}
.tname input:hover,.tname input:focus{border-color:var(--line);background:var(--raised)}
.insp-meta{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.insp-meta b{color:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{padding:2px 9px}
.mix{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px 10px}
.mix span{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid;color:var(--ink)}
.srows{display:flex;flex-direction:column;padding:0 12px}
.srow{display:flex;align-items:center;gap:8px;min-height:38px;border-bottom:1px dashed var(--line);padding:2px 0;cursor:pointer}
.srow .sno{width:20px;text-align:right;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.srow .empty{color:var(--faint);font-size:12px;flex:1}
.srow.over{background:var(--accent-soft);border-radius:6px}
body.dragging .srow.open .empty{color:var(--accent)}
.insp-foot{display:flex;gap:6px;padding:12px 16px 16px;flex-wrap:wrap}
.cards{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;align-content:start;background:var(--floor)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding-bottom:6px;min-width:0}
.card.head{grid-column:1/-1}
.card.head .srows{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));column-gap:16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 4px}
.card-t{border:0;background:none;padding:0;font-family:var(--font-display);font-size:19px}
.card-t:hover{color:var(--accent)}
.cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt.full{color:var(--ok);font-weight:700}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);z-index:60;max-width:calc(100% - 32px);font-size:13px}
.toast button{background:none;border:1px solid currentColor;color:inherit;padding:3px 10px}
.modal-back{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:70}
.modal{background:var(--panel);border-radius:16px;width:min(520px,100%);padding:20px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form .full{grid-column:1/-1}
.form .err{grid-column:1/-1;color:var(--danger);font-size:13px}
.mfoot{display:flex;gap:8px;margin-top:18px;align-items:center}
.mfoot .grow{flex:1}

@media (max-width:1180px){
  main.grid{grid-template-columns:300px minmax(0,1fr)}
  .inspector{position:fixed;right:0;top:0;bottom:0;width:min(360px,100%);z-index:50;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s}
  .inspector.open{transform:none}
}
@media (max-width:760px){
  html,body,#app{height:auto}
  main.grid{display:flex;flex-direction:column}
  .pool{border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:50vh}
  .planwrap{padding:8px;min-height:300px}
  .actions{margin-left:0}
}

function filtered(){const f=ui.f,q=f.q.trim().toLowerCase();
  let l=S.guests.filter(g=>g.table==null);
  if(f.bucket)l=l.filter(g=>g.bucket===f.bucket);
  if(f.side)l=l.filter(g=>sideOf(g.bucket)===f.side);
  if(f.assign)l=l.filter(g=>(g.assign||'')===f.assign);
  if(q)l=l.filter(g=>matchQ(g,q));
  const byName=(a,b)=>cmp(a.last,b.last)||cmp(a.first,b.first);
  if(f.sort==='first')l.sort((a,b)=>cmp(a.first,b.first)||cmp(a.last,b.last));
  else if(f.sort==='bucket')l.sort((a,b)=>BUCKETS.indexOf(a.bucket)-BUCKETS.indexOf(b.bucket)||byName(a,b));
  else if(f.sort==='assign')l.sort((a,b)=>cmp(a.assign,b.assign)||byName(a,b));
  else l.sort(byName);
  return l}

function bind(){
  document.addEventListener('click',e=>{
    if(e.target.id==='modal')return closeModal();
    if(!e.target.closest('.menuwrap'))$('#exportMenu').hidden=true;
    const a=e.target.closest('[data-act]');if(a){if(!a.disabled)handleAct(a.dataset.act,a);return}
    const v=e.target.closest('[data-view]');if(v){ui.view=v.dataset.view;ui.layout=false;savePrefs();return renderAll()}
    const c=e.target.closest('.chip');
    if(c){const gid=c.dataset.gid,row=c.closest('[data-seat]');
      if(ui.picked&&ui.picked!==gid&&row)return place(ui.picked,row.dataset.table,+row.dataset.seat);
      ui.picked=ui.picked===gid?null:gid;return renderAll()}
    const core=e.target.closest('[data-core]');
    if(core){if(justDragged||ui.layout)return;const tid=core.dataset.table;if(ui.picked)return place(ui.picked,tid,null);ui.sel=ui.sel===tid?null:tid;return renderAll()}
    const s=e.target.closest('[data-seat]');
    if(s){const tid=s.dataset.table,i=+s.dataset.seat;if(ui.picked)return place(ui.picked,tid,i);const g=SM.get(tid+':'+i);ui.sel=tid;ui.picked=g?g.id:null;return renderAll()}
    if(e.target.closest('#guestList')&&ui.picked){const g=gById(ui.picked);if(g&&g.table!=null)return unassign(g.id)}
  });
  $('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;$('#btnSave').onclick=save;
  $('#btnExport').onclick=()=>{$('#exportMenu').hidden=!$('#exportMenu').hidden};
  $('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(String(r.result),f.name);r.readAsText(f)};
  $('#fq').oninput=e=>{ui.f.q=e.target.value;renderList();if(ui.view==='plan')renderPlan()};
  $('#fBucket').onchange=e=>{ui.f.bucket=e.target.value;renderPool()};
  $('#fSide').onchange=e=>{ui.f.side=e.target.value;renderList()};
  $('#fAssign').onchange=e=>{ui.f.assign=e.target.value;renderList()};
  $('#fSort').onchange=e=>{ui.f.sort=e.target.value;renderList()};
  $('#colorBy').onchange=e=>{ui.colorBy=e.target.value;savePrefs();renderAll()};
  document.addEventListener('change',e=>{if(e.target.id==='tName'){const t=tById(ui.sel),v=e.target.value.trim();if(t&&v&&v!==t.name)commit(()=>{t.name=v},`Renamed to ${tLabel({...t,name:v})}`)}});
  document.addEventListener('dragstart',e=>{const d=e.target.closest&&e.target.closest('[data-gid][draggable]');if(!d)return;dragGid=d.dataset.gid;
    e.dataTransfer.setData('text/plain',dragGid);e.dataTransfer.effectAllowed='move';document.body.classList.add('dragging');requestAnimationFrame(()=>d.classList.add('ghosted'))});
  const endDrag=()=>{document.body.classList.remove('dragging');document.querySelectorAll('.ghosted,.over').forEach(x=>x.classList.remove('ghosted','over'));overEl=null;dragGid=null};
  document.addEventListener('dragend',endDrag);
  document.addEventListener('dragover',e=>{if(!dragGid)return;const z=e.target.closest&&e.target.closest('[data-drop]');if(!z){overEl?.classList.remove('over');overEl=null;return}
    e.preventDefault();e.dataTransfer.dropEffect='move';if(overEl!==z){overEl?.classList.remove('over');z.classList.add('over');overEl=z}});
  document.addEventListener('drop',e=>{if(!dragGid)return;const z=e.target.closest&&e.target.closest('[data-drop]');e.preventDefault();const gid=dragGid;endDrag();if(!z)return;
    if('unassign' in z.dataset)unassign(gid);else place(gid,z.dataset.table,z.dataset.seat!=null?+z.dataset.seat:null)});
  document.addEventListener('pointerdown',e=>{if(!ui.layout)return;const core=e.target.closest('[data-core]');if(!core)return;
    const tEl=core.closest('.tbl'),t=tById(tEl.dataset.tid);if(!t)return;e.preventDefault();
    const st={x:e.clientX,y:e.clientY,tx:t.x,ty:t.y,before:snap()};let moved=false;core.setPointerCapture(e.pointerId);
    const mv=ev=>{const dx=(ev.clientX-st.x)/SCALE,dy=(ev.clientY-st.y)/SCALE;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(!moved)return;
      const b=tableBox(t);t.x=Math.round(Math.min(PLAN_W-b.w/2,Math.max(b.w/2,st.tx+dx)));t.y=Math.round(Math.min(PLAN_H-b.h/2,Math.max(b.h/2,st.ty+dy)));
      tEl.style.left=(t.x-b.w/2)+'px';tEl.style.top=(t.y-b.h/2)+'px'};
    const up=()=>{core.removeEventListener('pointermove',mv);core.removeEventListener('pointerup',up);core.removeEventListener('pointercancel',up);
      if(moved){justDragged=true;setTimeout(()=>justDragged=false,80);undoStack.push(st.before);redoStack.length=0;changed(`Moved ${tLabel(t)}`,true)}};
    core.addEventListener('pointermove',mv);core.addEventListener('pointerup',up);core.addEventListener('pointercancel',up)});
  document.addEventListener('keydown',e=>{const inField=e.target.matches&&e.target.matches('input,select,textarea'),mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
    if(e.key==='Escape'&&e.target.id==='fq'&&e.target.value){e.target.value='';ui.f.q='';return renderAll()}
    if(e.key==='/'&&!inField&&!mod&&$('#modal').hidden){e.preventDefault();return $('#fq').focus()}
    if(mod&&k==='s'){e.preventDefault();return save()}
    if(mod&&!inField&&(k==='z'||k==='y')){e.preventDefault();return (k==='y'||e.shiftKey)?redo():undo()}
    if(e.key==='Escape'){if(!$('#modal').hidden)return closeModal();$('#exportMenu').hidden=true;if(ui.picked){ui.picked=null;return renderAll()}if(ui.layout){ui.layout=false;return renderPlan()}if(ui.sel){ui.sel=null;return renderAll()}}});
  addEventListener('beforeunload',e=>{if(HOSTED&&dirty&&!ui.readOnly){e.preventDefault();e.returnValue=''}});
  if('ResizeObserver' in window)new ResizeObserver(()=>fitPlan()).observe($('#planwrap'));else addEventListener('resize',fitPlan);
}
shell();bind();if(!S.guests.some(g=>g.table==null))$('.buckets').open=false;renderAll();
if(restored)toast('Restored your unsaved changes from this browser. Click Save to share them.');
if(HOSTED)getCap('artifact').then(a=>{if(!a){ui.readOnly=true;renderStatus()}});
})();
</script></body></html>
